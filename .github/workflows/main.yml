name: Build DeltaCraft Shop

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile mod
        run: gradle build --stacktrace
      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DeltaCraft-Shop-JAR
          path: build/libs/*.jar
          if-no-files-found: error
